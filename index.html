  <!-- Identity graph, kept static on purpose. The app is client-rendered, so
       crawlers that do not execute JavaScript (most social scrapers, several AI
       crawlers) never see the JSON-LD that useSEO injects. This is the copy they
       read. Route-specific schema is added at runtime from lib/structuredData.js;
       if you change identity here, change it there too. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Store",
        "@id": "https://recoffee.bg/#organization",
        "name": "ReCoffee",
        "legalName": "„РеКофи\" ЕООД",
        "vatID": "BG206123456",
        "url": "https://recoffee.bg",
        "logo": "https://recoffee.bg/og-image.jpg",
        "image": "https://recoffee.bg/og-image.jpg",
        "email": "hello@recoffee.bg",
        "telephone": "+359 2 987 65 43",
        "priceRange": "$$",
        "currenciesAccepted": "BGN",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "бул. „Витоша\" 45",
          "addressLocality": "София",
          "postalCode": "1000",
          "addressCountry": "BG"
        },
        "sameAs": [
          "https://www.instagram.com/recoffee.bg",
          "https://www.facebook.com/recoffee.bg"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://recoffee.bg/#website",
        "url": "https://recoffee.bg",
        "name": "ReCoffee",
        "inLanguage": "bg-BG",
        "publisher": { "@id": "https://recoffee.bg/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://recoffee.bg/shop?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    ]
  }
  </script>
